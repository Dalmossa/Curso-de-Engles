# ===========================================================================
# ITS Platform — Loki Configuration
# ===========================================================================
# Log aggregation for ITS Platform with pipelines for:
# - Application logs (JSON structured)
# - Audit logs (immutable, hash-chained from P2.2)
# - Kong access logs
# - Kubernetes events
# ---------------------------------------------------------------------------
auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: info
  http_server_read_timeout: 30s
  http_server_write_timeout: 30s
  grpc_server_max_recv_msg_size: 104857600
  grpc_server_max_send_msg_size: 104857600

common:
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    instance_addr: 127.0.0.1
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: boltdb-shipper
      object_store: filesystem
      schema: v11
      index:
        prefix: index_
        period: 24h

limits_config:
  reject_old_samples: true
  reject_old_samples_max_age: 168h
  ingestion_rate_mb: 50
  ingestion_burst_size_mb: 100
  per_stream_rate_limit: 10
  per_stream_rate_limit_burst: 20
  max_entries_limit_per_query: 5000
  max_global_streams_per_user: 0
  max_line_size: 10485760  # 10MB
  max_cache_freshness: 10m
  split_queries_by_interval: 15m
  cardinality_limit: 100000

chunk_store_config:
  max_look_back_period: 30d
  chunk_write_timeout: 5m
  chunk_encoding: snappy

table_manager:
  retention_deletes_enabled: true
  retention_period: 30d
  index_queries_cache_config:
    enable_fifocache: true
    fifocache:
      max_size_items: 1024
      validity: 24h

compactor:
  working_directory: /loki/compactor
  shared_store: filesystem
  compaction_interval: 10m
  retention_delete_delay: 2h
  delete_request_cancel_period: 15m
  compaction_concurrency: 10

# Ruler configuration for Loki alerting rules
ruler:
  storage:
    type: local
    local:
      directory: /loki/rules
  rule_path: /loki/rules-temp
  alertmanager_url: http://alertmanager:9093
  ring:
    kvstore:
      store: inmemory
  enable_api: true
  evaluation_interval: 30s
  poll_interval: 10s

# Query frontend for better performance
query_frontend:
  max_outstanding_per_tenant: 2048
  compress_responses: true

# Query scheduler
query_scheduler:
  max_outstanding_requests_per_tenant: 100

# Frontend worker
frontend_worker:
  frontend_address: loki-query-frontend:9095
  parallelism: 10

# Distributor for ingestion
distributor:
  ring:
    kvstore:
      store: inmemory

# Ingester for writing logs
ingester:
  lifecycler:
    ring:
      kvstore:
        store: inmemory
      replication_factor: 1
  max_chunk_age: 2h
  chunk_idle_period: 5m
  chunk_block_size: 256KB
  chunk_retain_period: 30s
  max_transfer_retries: 0

# ---------------------------------------------------------------------------
# Pipeline Stages for Log Processing
# ---------------------------------------------------------------------------
# These stages are applied via Promtail/Loki client configuration
# The actual pipeline configuration lives in promtail-config.yaml
# but is documented here for reference.

# Pipeline for ITS Platform Application Logs (JSON structured)
# Expected log format:
# {
#   "timestamp": "2024-01-15T10:30:45.123Z",
#   "level": "info",
#   "message": "User authenticated",
#   "service": "its-platform-api",
#   "trace_id": "abc123...",
#   "span_id": "def456...",
#   "learner_id": "uuid...",
#   "session_id": "uuid...",
#   "lesson_id": "les_...",
#   "item_id": "item_...",
#   "metadata": {}
# }

# Pipeline for Audit Logs (P2.2 - Immutable, Hash-Chained)
# Expected log format:
# {
#   "timestamp": "2024-01-15T10:30:45.123Z",
#   "level": "info",
#   "message": "Audit event appended",
#   "service": "its-platform-api",
#   "audit": {
#     "seq": "12345",
#     "event_id": "uuid...",
#     "event_type": "item_response|diagnostic_run|session_start|session_end|auth_success|auth_failure|access_denied|validation_failure|consent_granted|consent_withdrawn|data_export|data_erasure",
#     "learner_id": "uuid...",
#     "session_id": "uuid...",
#     "lesson_id": "les_...",
#     "item_id": "item_...",
#     "skill_ids": ["skill_...", "skill_..."],
#     "occurred_at": "2024-01-15T10:30:45.123Z",
#     "payload": {},
#     "prev_hash": "base64...",
#     "row_hash": "base64..."
#   }
# }

# Pipeline for Kong Access Logs
# Expected log format (JSON):
# {
#   "timestamp": "2024-01-15T10:30:45.123Z",
#   "level": "info",
#   "message": "HTTP request",
#   "service": "kong",
#   "request": {
#     "method": "GET",
#     "path": "/api/v1/lessons/les_a1_greetings",
#     "query": "",
#     "size": 0,
#     "headers": {}
#   },
#   "response": {
#     "status": 200,
#     "size": 1024,
#     "latency_ms": 45
#   },
#   "client": {
#     "ip": "10.0.0.1",
#     "user_agent": "Mozilla/5.0..."
#   },
#   "upstream": {
#     "host": "its-platform-api",
#     "latency_ms": 30
#   },
#   "auth": {
#     "consumer": "learner-123",
#     "credential": "jwt"
#   }
# }

# Pipeline for Kubernetes Events
# Standard kube-event format from kube-event-exporter