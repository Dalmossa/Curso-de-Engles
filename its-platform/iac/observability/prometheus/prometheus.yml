# ===========================================================================
# ITS Platform — Prometheus Configuration
# ===========================================================================
# Standalone Prometheus config for the observability stack.
# Can be used independently or as reference for Helm chart values.
# ===========================================================================

global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels:
    cluster: '{{ .Environment }}'
    platform: its-platform

# Alertmanager integration
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

# Rule files for alerting and recording rules
rule_files:
  - '/etc/prometheus/rules/*.yml'

# Scrape configurations
scrape_configs:
  # ---------------------------------------------------------------------------
  # Kubernetes API Servers
  # ---------------------------------------------------------------------------
  - job_name: 'kubernetes-apiservers'
    kubernetes_sd_configs:
      - role: endpoints
    scheme: https
    tls_config:
      ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
    bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
    relabel_configs:
      - source_labels: [__meta_kubernetes_namespace, __meta_kubernetes_service_name, __meta_kubernetes_endpoint_port_name]
        action: keep
        regex: default;kubernetes;https

  # ---------------------------------------------------------------------------
  # Kubernetes Nodes (via kubelet)
  # ---------------------------------------------------------------------------
  - job_name: 'kubernetes-nodes'
    kubernetes_sd_configs:
      - role: node
    scheme: https
    tls_config:
      ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
    bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
    relabel_configs:
      - action: labelmap
        regex: __meta_kubernetes_node_label_(.+)

  # ---------------------------------------------------------------------------
  # Kubernetes Pods (services with prometheus.io/scrape annotation)
  # ---------------------------------------------------------------------------
  - job_name: 'kubernetes-pods'
    kubernetes_sd_configs:
      - role: pod
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
        action: keep
        regex: true
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
        action: replace
        target_label: __metrics_path__
        regex: (.+)
      - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
        action: replace
        regex: ([^:]+)(?::\d+)?;(\d+)
        replacement: $1:$2
        target_label: __address__
      - action: labelmap
        regex: __meta_kubernetes_pod_label_(.+)
      - source_labels: [__meta_kubernetes_namespace]
        action: replace
        target_label: kubernetes_namespace
      - source_labels: [__meta_kubernetes_pod_name]
        action: replace
        target_label: kubernetes_pod_name

  # ---------------------------------------------------------------------------
  # ITS Platform Services (application metrics)
  # Scrapes /metrics on pods annotated with prometheus.io/scrape=true
  # Uses /health and /ready as probe endpoints per P0.8
  # ---------------------------------------------------------------------------
  - job_name: 'its-platform-services'
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names:
            - its-platform-dev
            - its-platform-staging
            - its-platform-prod
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
        action: keep
        regex: true
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
        action: replace
        target_label: __metrics_path__
        regex: (.+)
      - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
        action: replace
        regex: ([^:]+)(?::\d+)?;(\d+)
        replacement: $1:$2
        target_label: __address__
      - action: labelmap
        regex: __meta_kubernetes_pod_label_(.+)
      - source_labels: [__meta_kubernetes_namespace]
        action: replace
        target_label: namespace
      - source_labels: [__meta_kubernetes_pod_name]
        action: replace
        target_label: pod
    # Health/readiness probe metrics
    metric_relabel_configs:
      - source_labels: [__name__]
        action: keep
        regex: '(http_requests_total|http_request_duration_seconds_bucket|up|process_.*|nodejs_.*|go_.*|container_.*|kube_.*|pg_.*|redis_.*|celery_.*|audit_.*|diagnostic_.*|mastery_.*|practice_.*|audio_.*)'

  # ---------------------------------------------------------------------------
  # Node Exporter (host-level metrics)
  # ---------------------------------------------------------------------------
  - job_name: 'node-exporter'
    kubernetes_sd_configs:
      - role: node
    relabel_configs:
      - action: labelmap
        regex: __meta_kubernetes_node_label_(.+)

  # ---------------------------------------------------------------------------
  # cAdvisor (container metrics)
  # ---------------------------------------------------------------------------
  - job_name: 'cadvisor'
    kubernetes_sd_configs:
      - role: node
    scheme: https
    tls_config:
      ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
    bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
    relabel_configs:
      - action: labelmap
        regex: __meta_kubernetes_node_label_(.+)

  # ---------------------------------------------------------------------------
  # PostgreSQL Exporter
  # ---------------------------------------------------------------------------
  - job_name: 'postgresql'
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names:
            - its-platform-dev
            - its-platform-staging
            - its-platform-prod
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_component]
        action: keep
        regex: postgresql
      - source_labels: [__meta_kubernetes_pod_name]
        action: replace
        target_label: pod

  # ---------------------------------------------------------------------------
  # Redis Exporter
  # ---------------------------------------------------------------------------
  - job_name: 'redis'
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names:
            - its-platform-dev
            - its-platform-staging
            - its-platform-prod
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_component]
        action: keep
        regex: redis
      - source_labels: [__meta_kubernetes_pod_name]
        action: replace
        target_label: pod

  # ---------------------------------------------------------------------------
  # pgBackRest Exporter (backup metrics)
  # ---------------------------------------------------------------------------
  - job_name: 'pgbackrest'
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names:
            - its-platform-dev
            - its-platform-staging
            - its-platform-prod
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_component]
        action: keep
        regex: postgresql
      - source_labels: [__meta_kubernetes_pod_name]
        action: replace
        target_label: pod
      - source_labels: [__meta_kubernetes_pod_container_name]
        action: keep
        regex: pgbackrest
      - action: replace
        regex: (.*):(\d+)
        target_label: __address__
        replacement: $1:8432

  # ---------------------------------------------------------------------------
  # Kong API Gateway Exporter
  # ---------------------------------------------------------------------------
  - job_name: 'kong'
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names:
            - kong
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_name]
        action: replace
        target_label: pod

  # ---------------------------------------------------------------------------
  # Prometheus Self-Monitoring
  # ---------------------------------------------------------------------------
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # ---------------------------------------------------------------------------
  # Alertmanager
  # ---------------------------------------------------------------------------
  - job_name: 'alertmanager'
    static_configs:
      - targets: ['alertmanager:9093']

  # ---------------------------------------------------------------------------
  # Loki
  # ---------------------------------------------------------------------------
  - job_name: 'loki'
    static_configs:
      - targets: ['loki:3100']

  # ---------------------------------------------------------------------------
  # Tempo
  # ---------------------------------------------------------------------------
  - job_name: 'tempo'
    static_configs:
      - targets: ['tempo:3200']

  # ---------------------------------------------------------------------------
  # OpenTelemetry Collector
  # ---------------------------------------------------------------------------
  - job_name: 'otel-collector'
    static_configs:
      - targets: ['otel-collector:8889']

  # ---------------------------------------------------------------------------
  # Grafana
  # ---------------------------------------------------------------------------
  - job_name: 'grafana'
    static_configs:
      - targets: ['grafana:3000']