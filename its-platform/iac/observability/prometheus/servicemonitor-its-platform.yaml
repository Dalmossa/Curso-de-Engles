# ===========================================================================
# ITS Platform — ServiceMonitor for ITS Platform Services
# ===========================================================================
# Scrapes application metrics from ITS Platform pods.
# Requires Prometheus Operator CRDs installed in the cluster.
# ---------------------------------------------------------------------------
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: its-platform-services
  namespace: monitoring
  labels:
    app: its-platform
    release: prometheus
spec:
  selector:
    matchLabels:
      app: its-platform-api
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
      # Health/readiness probe metrics
      relabelings:
        - sourceLabels: [__name__]
          action: keep
          regex: '(http_requests_total|http_request_duration_seconds_bucket|up|process_.*|nodejs_.*|go_.*|audit_.*|diagnostic_.*|mastery_.*|practice_.*|audio_.*)'
  namespaceSelector:
    matchNames:
      - its-platform-dev
      - its-platform-staging
      - its-platform-prod
---
