apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: its-platform-staging
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    app.kubernetes.io/name: its-platform
    app.kubernetes.io/part-of: its-platform
    app.kubernetes.io/environment: staging
spec:
  project: its-platform
  source:
    repoURL: https://github.com/its-platform/its-platform.git
    targetRevision: "staging-*"
    path: iac/helm/its-platform
    helm:
      valueFiles:
        - values.yaml
        - values-staging.yaml
      parameters:
        - name: global.environment
          value: "staging"
  destination:
    server: https://kubernetes.default.svc
    namespace: its-platform-staging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas  # HPA manages replicas
