# ===========================================================================
# ITS Platform — Default Helm Values
# ===========================================================================
# Environment-specific overrides in values-dev.yaml, values-staging.yaml, values-prod.yaml
# ===========================================================================

global:
  # Environment name: dev | staging | prod
  environment: dev
  # Image registry (override per env if needed)
  imageRegistry: ghcr.io
  # Image pull secrets (if using private registry)
  imagePullSecrets: []

# ===========================================================================
# Application Deployment
# ===========================================================================
deployment:
  # Replica count (HPA will manage in production)
  replicas: 1
  # Resource requests/limits
  resources:
    requests:
      cpu: "250m"
      memory: "256Mi"
    limits:
      cpu: "1000m"
      memory: "1Gi"
  # Health checks
  livenessProbe:
    httpGet:
      path: /health
      port: http
    initialDelaySeconds: 30
    periodSeconds: 10
  readinessProbe:
    httpGet:
      path: /ready
      port: http
    initialDelaySeconds: 10
    periodSeconds: 5
  # Pod disruption budget
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  # Security context
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    fsGroup: 1000
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
  # Service account
  serviceAccount:
    create: true
    name: its-platform

# ===========================================================================
# Service
# ===========================================================================
service:
  type: ClusterIP
  port: 80
  targetPort: 3000
  annotations: {}

# ===========================================================================
# Ingress
# ===========================================================================
ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/rate-limit: "1000"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
  hosts:
    - host: its-platform.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: its-platform-tls
      hosts:
        - its-platform.example.com

# ===========================================================================
# Horizontal Pod Autoscaler
# ===========================================================================
hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 10
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
        - type: Pods
          value: 4
          periodSeconds: 15
      selectPolicy: Max

# ===========================================================================
# NetworkPolicy
# ===========================================================================
networkPolicy:
  enabled: true
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              name: ingress-nginx
      ports:
        - protocol: TCP
          port: 3000
    - from:
        - namespaceSelector:
            matchLabels:
              name: monitoring
      ports:
        - protocol: TCP
          port: 3000

# ===========================================================================
# ServiceMonitor (Prometheus)
# ===========================================================================
serviceMonitor:
  enabled: true
  interval: 30s
  scrapeTimeout: 10s
  labels:
    release: prometheus

# ===========================================================================
# PodMonitor (for application metrics)
# ===========================================================================
podMonitor:
  enabled: true
  interval: 30s

# ===========================================================================
# ConfigMap (application config)
# ===========================================================================
configMap:
  enabled: true
  data:
    NODE_ENV: production
    PORT: "3000"
    LOG_LEVEL: info
    # API versioning
    API_PREFIX: /api/v1
    # CORS
    CORS_ORIGIN: "*"
    # Rate limiting (complementary to Kong)
    RATE_LIMIT_WINDOW_MS: "60000"
    RATE_LIMIT_MAX_REQUESTS: "100"

# ===========================================================================
# Secret (secrets managed externally via SealedSecrets or External Secrets)
# ===========================================================================
secrets:
  enabled: true
  # These will be populated by SealedSecrets or External Secrets Operator
  # Placeholders shown here; actual values injected at deploy time
  stringData:
    DATABASE_URL: ""
    JWT_PUBLIC_KEY: ""
    KONG_REDIS_USERNAME: ""
    KONG_REDIS_PASSWORD: ""
    REDIS_URL: ""
    SENTRY_DSN: ""

# ===========================================================================
# Database (PostgreSQL - managed externally or via CloudNativePG)
# ===========================================================================
postgresql:
  enabled: false  # Set to true if deploying DB via Helm (CloudNativePG recommended)
  # If enabled, configure:
  # primary:
  #   persistence:
  #     size: 10Gi
  #   resources:
  #     limits:
  #       cpu: 1000m
  #       memory: 1Gi

# ===========================================================================
# Redis (for BullMQ, rate limiting, caching)
# ===========================================================================
redis:
  enabled: false  # Set to true if deploying Redis via Helm
  # If enabled, configure:
  # architecture: standalone
  # auth:
  #   enabled: true
  #   password: ""
  # master:
  #   persistence:
  #     size: 5Gi
  #   resources:
  #     limits:
  #       cpu: 500m
  #       memory: 512Mi

# ===========================================================================
# Kong API Gateway (deployed separately; config in iac/kong/)
# ===========================================================================
kong:
  enabled: false

# ===========================================================================
# ArgoCD Application (managed by ArgoCD; these values inform the chart)
# ===========================================================================
argocd:
  project: its-platform
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m

# ===========================================================================
# Monitoring & Logging
# ===========================================================================
monitoring:
  prometheus:
    enabled: true
    serviceMonitor:
      enabled: true
    rules:
      enabled: true
  grafana:
    enabled: true
    dashboards:
      enabled: true
  loki:
    enabled: true
  tempo:
    enabled: true

# ===========================================================================
# Backup (pgBackRest)
# ===========================================================================
backup:
  enabled: false  # Configured separately via pgBackRest operator
  # schedule: "0 2 * * *"  # Daily at 2 AM
  # retention: 30d

# ===========================================================================
# Tests (helm test)
# ===========================================================================
tests:
  enabled: true

# ===========================================================================
# Backup (pgBackRest) — P2.6
# ===========================================================================
backup:
  enabled: true
  s3:
    bucket: its-platform-pgbackrest
    region: us-east-1
    # accessKey and secretKey injected via SealedSecrets at deploy time
  crossRegion:
    enabled: true
    s3:
      bucket: its-platform-pgbackrest-dr
      region: us-west-2
  retention:
    full: 30
    diff: 7
    archive: 7
  schedule:
    full: "0 2 * * *"      # Daily at 02:00 UTC
    diff: "0 */6 * * *"    # Every 6 hours
  restoreTest:
    enabled: true
    schedule: "0 4 * * 0"  # Weekly Sunday 04:00 UTC

# ===========================================================================
# PostgreSQL (CloudNativePG or self-managed)
# ===========================================================================
postgresql:
  enabled: true
  image:
    registry: docker.io
    repository: postgres
    tag: "16-alpine"
  database: its_platform
  username: postgres
  replicas: 1
  persistence:
    enabled: true
    storageClass: standard
    size: 20Gi
  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "1000m"
      memory: "2Gi"

# ===========================================================================
# Monitoring Stack (LGTM: Loki, Grafana, Tempo, Prometheus) — P2.7
# ===========================================================================
monitoring:
  prometheus:
    enabled: true
    retention: 30d
    storageSize: 20Gi
    scrapeInterval: 30s
  grafana:
    enabled: true
    adminPassword: ""  # Set via SealedSecrets
    persistence:
      enabled: true
      size: 5Gi
  loki:
    enabled: true
    persistence:
      enabled: true
      size: 20Gi
    retention: 30d
  tempo:
    enabled: true
    persistence:
      enabled: true
      size: 20Gi
    retention: 30d
  alertmanager:
    enabled: true
    smtpPassword: ""  # Set via SealedSecrets
    pagerdutyKey: ""  # Set via SealedSecrets
    slackWebhook: ""  # Set via SealedSecrets
  opentelemetry:
    enabled: true
    collectorReplicas: 2
