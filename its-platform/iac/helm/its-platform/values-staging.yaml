# ===========================================================================
# ITS Platform — Staging Environment Values
# ===========================================================================
# Auto-synced on tag `staging-*`
# ===========================================================================

global:
  environment: staging
  imageRegistry: ghcr.io

deployment:
  replicas: 2
  resources:
    requests:
      cpu: "250m"
      memory: "256Mi"
    limits:
      cpu: "1000m"
      memory: "1Gi"

ingress:
  enabled: true
  hosts:
    - host: its-platform-staging.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: its-platform-staging-tls
      hosts:
        - its-platform-staging.example.com

hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

networkPolicy:
  enabled: true

serviceMonitor:
  enabled: true

configMap:
  data:
    NODE_ENV: production
    LOG_LEVEL: info
    API_PREFIX: /api/v1

secrets:
  stringData:
    DATABASE_URL: ""
    JWT_PUBLIC_KEY: ""
    REDIS_URL: ""

monitoring:
  prometheus:
    enabled: true
  grafana:
    enabled: true
  loki:
    enabled: true
  tempo:
    enabled: true

backup:
  enabled: true

tests:
  enabled: true
