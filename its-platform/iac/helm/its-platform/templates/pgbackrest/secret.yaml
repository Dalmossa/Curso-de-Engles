{{- if .Values.backup.enabled -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "its-platform.fullname" . }}-pgbackrest-s3
  labels:
    {{- include "its-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: pgbackrest
type: Opaque
stringData:
  access-key: {{ .Values.backup.s3.accessKey | default "" }}
  secret-key: {{ .Values.backup.s3.secretKey | default "" }}
  {{- if .Values.backup.crossRegion.enabled }}
  dr-access-key: {{ .Values.backup.crossRegion.s3.accessKey | default "" }}
  dr-secret-key: {{ .Values.backup.crossRegion.s3.secretKey | default "" }}
  {{- end }}
