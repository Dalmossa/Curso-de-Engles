          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LessonContent'
        '401':
          description: Unauthorized — a valid bearer token is required (ADR-038 D4)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Forbidden — the credential does not carry the authority this operation requires (ADR-038 D2/D4)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: Lesson not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /content/packs/{pack_id}:
    get:
      tags: [content]
      summary: Get practice pack with items
      operationId: getPack
      security:
        - BearerAuth: []
      parameters:
        - name: pack_id
          in: path
