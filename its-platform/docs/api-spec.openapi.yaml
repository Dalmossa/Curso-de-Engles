      responses:
        '200':
          description: Next activity with rationale
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NextActivity'
        '401':
          description: Unauthorized — a valid bearer token is required (ADR-038 D4)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Forbidden — the credential does not carry the authority this operation requires (ADR-038 D2/D4)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: Learner not found or curriculum exhausted
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /learners/{learner_id}/practice:
    post:
      tags: [practice]
      summary: Submit practice pack responses
      operationId: submitPractice
      security:
        - BearerAuth: []
