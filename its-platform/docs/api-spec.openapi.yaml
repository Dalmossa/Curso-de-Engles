            pattern: '^pack[-_]les_[a-z0-9_]+(_v1)?$'
      responses:
        '200':
          description: Pack content with items
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PackContent'
        '401':
          description: Unauthorized — a valid bearer token is required (ADR-038 D4)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Forbidden — the credential does not carry the authority this operation requires (ADR-038 D2/D4)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: Pack not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /content/listening/{dialogue_id}:
    get:
      tags: [listening]
      summary: Get listening dialogue with slots (filtered by Status)
      operationId: getDialogue
      security:
        - BearerAuth: []
      parameters:
        - name: dialogue_id
          in: path
          required: true
          schema:
            type: string
            pattern: '^dlg_[a-z0-9_]+$'
      responses:
        '200':
          description: Dialogue with slots
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DialogueContent'
        '401':
          description: Unauthorized — a valid bearer token is required (ADR-038 D4)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Forbidden — the credential does not carry the authority this operation requires (ADR-038 D2/D4)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: Dialogue not found, or found but not `shipped` — the same 404 body for both (ADR-027 §3)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /content/listening/{dialogue_id}/audio:
    get:
      tags: [listening]
      summary: Get the signed audio playlist for a dialogue
      description: |
        Returns one signed URL per clip of the dialogue, in `sort_index` order, from the highest
        `take` complete for the whole dialogue (ADR-028 §2). Catalogue audio only: the signed URL
        carries no learner identifier and this path reads no learner context (ADR-028 §4).
      operationId: getDialogueAudio
      security:
        - BearerAuth: []
      parameters:
        - name: dialogue_id
          in: path
          required: true
          schema:
            type: string
            pattern: '^dlg_[a-z0-9_]+$'
        - name: rate
          in: query
          required: false
          schema:
            type: number
            enum: [1, 0.75]
            default: 1
      responses:
        '200':
          description: The dialogue's signed audio playlist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DialogueAudio'
        '400':
          description: Malformed `dialogue_id`, or an unsupported `rate`
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Unauthorized — a valid bearer token is required (ADR-038 D4)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Forbidden — the credential does not carry the authority this operation requires (ADR-038 D2/D4)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: >-
            Dialogue not found, not `shipped`, without a render `take` complete for the whole
            dialogue, or (when any item is L2) without its renders ear-checked — one 404 body for
            every case, so admission cannot be probed for (ADR-028 §3).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /content/grammar-tip:
    get:
      tags: [content]
      summary: Get a quick grammar tip from the local RAG corpus
      description: |
        Returns short grammar explanations retrieved from the local offline RAG utility. If the
        local environment cannot execute the utility, the endpoint responds gracefully with an
        empty tips array instead of a server error.
      operationId: getGrammarTip
      security:
        - BearerAuth: []
      parameters:
        - name: topic
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 120
      responses:
        '200':
          description: Grammar tips for the requested topic
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GrammarTipResponse'
        '400':
          description: Missing or invalid `topic` query parameter
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Unauthorized — a valid bearer token is required (ADR-038 D4)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Forbidden — the credential does not carry the authority this operation requires (ADR-038 D2/D4)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'


  /content/tts:
    post:
      tags: [content]
      summary: Synthesize a lesson phrase (TTS)
      description: |
        História 1. Returns a synthesized render of `text`, or — when this environment has no TTS
        engine — a `200` carrying `engine: "none"` and `audio: null` so the client falls back to
        `window.speechSynthesis` (en-US). The fallback is the designed path in bare-metal
        deployments, not an error: answering `5xx` would take the lesson screen down for a
        capability the browser provides itself.

        `POST` rather than `GET` because the phrase is content, up to 500 characters. In a query
        string it would land in access logs, browser history and `Referer` headers.
      operationId: synthesizeSpeech
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SpeechSynthesisRequest'
      responses:
        '200':
          description: The synthesized render, or an explicit statement that no engine is configured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpeechSynthesis'
        '400':
          description: Invalid body — `text` outside 1–500 characters, `voice` outside `xx-YY`, or `rate` outside `1 | 0.75`
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Unauthorized — a valid bearer token is required (ADR-038 D4)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Forbidden — the credential does not carry the authority this operation requires (ADR-038 D2/D4)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /learners/{learner_id}/data-export:
    get:
      tags: [learners]
      summary: Export all personal data (LGPD Art. 18)
      description: |
        Returns all personal data the platform holds for the learner in a structured,
        machine-readable JSON format. Implements LGPD Art. 18 II/V (access & portability).
        Requires `learner:export` scope.
      operationId: exportLearnerData
      security:
        - BearerAuth: []
      parameters:
        - name: learner_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Complete personal data export
          content:
            application/json:
              schema:
                type: object
                required: [learner, profile, diagnostics, practice, consents, exported_at]
                properties:
                  learner:
                    type: object
                    required: [learner_id, created_at]
                    properties:
                      learner_id:
                        type: string
                        format: uuid
                      created_at:
                        type: string
                        format: date-time
                      last_active_at:
                        type: [string, 'null']
                        format: date-time
                  profile:
                    type: object
                    required: [cefr_level, mastery, theta_estimates, fsrs_states, preferences]
                    properties:
                      cefr_level:
                        type: [string, 'null']
                        pattern: '^(A1|A2|B1|B2|C1|C2)$'
                      mastery:
                        type: object
                        additionalProperties:
                          type: number
                          minimum: 0
                          maximum: 1
                      theta_estimates:
                        type: object
                      fsrs_states:
                        type: object
                      preferences:
                        type: object
                        required: [recast_enabled, meta_button_enabled, audio_autoplay, daily_goal_minutes]
                        properties:
                          recast_enabled: { type: boolean }
                          meta_button_enabled: { type: boolean }
                          audio_autoplay: { type: boolean }
                          daily_goal_minutes: { type: integer }
                  diagnostics:
                    type: array
                    items:
                      type: object
                      required: [id, cefr, theta_estimate, skill_theta, form_version, completed_at]
                      properties:
                        id: { type: string, format: uuid }
                        cefr: { type: string, pattern: '^(A1|A2|B1|B2|C1|C2)$' }
                        theta_estimate: { type: number }
                        skill_theta: { type: object }
                        form_version: { type: string }
                        completed_at: { type: string, format: date-time }
                  practice:
                    type: array
                    items:
                      type: object
                      required: [id, pack_id, score, correct_count, total_count, started_at]
                      properties:
                        id: { type: string, format: uuid }
                        pack_id: { type: string }
                        score: { type: number }
                        correct_count: { type: integer }
                        total_count: { type: integer }
                        started_at: { type: string, format: date-time }
                        completed_at: { type: [string, 'null'], format: date-time }
                  consents:
                    type: array
                    items:
                      type: object
                      required: [purpose, version, legal_basis]
                      properties:
                        purpose: { type: string }
                        version: { type: string }
                        granted_at: { type: [string, 'null'], format: date-time }
                        withdrawn_at: { type: [string, 'null'], format: date-time }
                        legal_basis: { type: string }
                  exported_at:
                    type: string
                    format: date-time
        '401':
          description: Unauthorized — a valid bearer token is required (ADR-038 D4)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Forbidden — the credential does not carry the `learner:export` authority (ADR-038 D2/D4)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: Learner not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /learners/{learner_id}:
    delete:
      tags: [learners]
      summary: Erase all personal data (LGPD Art. 18)
      description: |
        Deletes all personal data the platform holds for the learner. Implements
        LGPD Art. 18 IV/VI (right to erasure / right to be forgotten).
        Requires `learner:erase` scope.
        The deletion is atomic with the visibility check (ADR-026 §1).
      operationId: eraseLearnerData
      security:
        - BearerAuth: []
      parameters:
        - name: learner_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: All personal data erased
        '401':
          description: Unauthorized — a valid bearer token is required (ADR-038 D4)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Forbidden — the credential does not carry the `learner:erase` authority (ADR-038 D2/D4)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: Learner not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /learners/{learner_id}/profile:
    get:
      tags: [learners]
      summary: Get learner profile with mastery, θ, FSRS states
      operationId: getLearnerProfile
      security:
        - BearerAuth: []
      parameters:
        - name: learner_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Learner profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LearnerProfile'
        '401':
          description: Unauthorized — a valid bearer token is required (ADR-038 D4)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Forbidden — the credential does not carry the authority this operation requires (ADR-038 D2/D4)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: Learner not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    patch:
      tags: [learners]
      summary: Update the learner's own display name and avatar
      description: >-
        The learner corrects the name they are shown and the picture beside it. Both members are
        optional, and each of them has three states: omitted (leave it as it is), `null` (clear
        it) or a value (set it). A body that declares a member the contract does not is rejected
        with `400` (`CONSTITUTION.md` §4.5), and so is a body whose member is not acceptable —
        an avatar that is not an `https://` URL or a raster `data:` URL is refused, because the
        rule is a safety rule and not a formatting preference.

        The route is about the caller's **own** resource (`learner:self`), and the addressed
        learner is resolved inside the caller's own transaction before anything is written, so a
        write to somebody else's row never happens; a foreign learner answers the same `404` a
        nonexistent one does (ADR-038 D3).
      operationId: updateLearnerProfile
      security:
        - BearerAuth: []
      parameters:
        - name: learner_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateLearnerProfileRequest'
      responses:
        '200':
          description: The identity as it now stands
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LearnerIdentity'
        '400':
          description: The body declares a member the contract does not, or a member that is not acceptable
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Unauthorized — a valid bearer token is required (ADR-038 D4)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Forbidden — the credential does not carry the authority this operation requires (ADR-038 D2/D4)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: Learner not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /learners/{learner_id}/mastery:
