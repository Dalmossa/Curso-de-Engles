          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Unauthorized — a valid bearer token is required (ADR-038 D4)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Forbidden — the credential does not carry the authority this operation requires (ADR-038 D2/D4)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: Pack or learner not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /practice/pronunciation-evaluate:
    post:
      tags: [practice]
      summary: Score the pronunciation of a recording against a target phrase
      description: |
        História 2. Accepts either the browser's own transcription (`transcript`, from the Web
        Speech API) or the recorded audio (`audio_base64`) when an ASR service is configured, and
        returns a word-by-word comparison with the target phrase.

        There is no fabricated score: when neither a transcript nor an ASR service is available the
        answer is `422`, not a `0`. A `0` for "nothing was heard" would be indistinguishable from a
        `0` for "everything was said wrong", and the learner would act on the wrong one.
      operationId: evaluatePronunciation
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PronunciationEvaluationRequest'
      responses:
        '200':
          description: Overall score, per-word status and a short pt-BR hint
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PronunciationEvaluation'
        '400':
          description: >-
            Invalid body, or neither `transcript` nor `audio_base64` supplied. An undeclared
            member is rejected (`additionalProperties: false`), not ignored.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Unauthorized — a valid bearer token is required (ADR-038 D4)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Forbidden — the credential does not carry the authority this operation requires (ADR-038 D2/D4)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: >-
            No transcript was supplied and this environment has no ASR service, or the ASR service
            failed to transcribe the recording. The platform declines to score rather than invent
            a result.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /practice/pronunciation-history:
    get:
      tags: [practice]
      summary: Get the authenticated learner's pronunciation practice history
      description: |
        Returns the most recent pronunciation attempts for the authenticated learner together
        with aggregate metrics to guide remediation.
      operationId: getPronunciationHistory
      security:
