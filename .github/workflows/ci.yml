name: CI Pipeline

# ---------------------------------------------------------------------------
# WHY THIS FILE LIVES AT THE REPOSITORY ROOT
# ---------------------------------------------------------------------------
# Until 2026-10-10 the only workflow in this repository was
#   its-platform/.github/workflows/ci.yml
# GitHub Actions reads workflows from `<repo-root>/.github/workflows/` and
# nowhere else; a workflow in a subdirectory is never loaded. `git log --all
# --diff-filter=D -- .github/workflows` shows no root workflow was ever deleted
# to move it here — it was authored in the subdirectory on 2026-10-04 (commit
# cc5e28e, "implement M1.1 foundation - CI pipeline") and has never run.
#
# This matters because every "CI green" claim in BACKLOG.md / MEMORY.md for
# P0.5, P0.8 and P0.9 was made about a pipeline that could not execute. The
# jobs below are the same jobs, relocated and corrected:
#
#   * `lint` no longer installs Poetry and runs ruff/black against the Python
#     tree that P0.9 deleted; it typechecks and lints the TypeScript tree.
#   * `unit` and `integration` exist. They were comment-only stubs (only the
#     `Upload coverage` step survived, absorbed into `contract-test`).
#   * `integration` runs the PGlite suites that the content loader never had
#     a working harness for.
#
# CURRENTLY RED — with the blocker named, not silently skipped
# ---------------------------------------------------------------------------
# `unit`         : 5 failures in tests/domain/services/next-activity-selector.spec.ts.
#                  That suite asserts behaviour against the §7.1 worked example of
#                  specs/curriculum-graph-spec.md (`skill_transfer` /
#                  `new_skills_introduced`) that was designed but never materialised
#                  for the other 122 lessons. Blocker: ADR-021 (skill-metadata source).
# `integration`  : 4 failures. tests/helpers/db.ts now connects, which is how the real
#                  blocker became visible: src/infrastructure/content/content-loader.ts
#                  writes `cefr_levels (cefr_level, description)` and `modules
#                  (module_id, ...)` whereas the P0.4 schema (ADR-019) defines
#                  `cefr_levels (code, label, ...)` and `modules (id, ...)`. The loader
#                  and the ERD were never reconciled. Blocker: BACKLOG P0.10.
# `content-loader`: `scripts/content-check.mjs` used to hang and exit 0 without running
#                  a single assertion (see the note in that file). With the harness
#                  repaired it now runs the loader and fails on the same schema
#                  mismatch, which is the honest signal.
#
# These jobs are deliberately blocking. A gate that cannot fail is worse than no
# gate: it occupies the place where the check belongs and silences the alarm.
# ---------------------------------------------------------------------------

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    # Weekly, Monday 03:00 UTC — a full run of every gate even on an idle week.
    - cron: '0 3 * * 1'
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"

jobs:
  # ------------------------------------------------------------------
  # Lint & Type Check (TypeScript — the Python tree was deleted in P0.9)
  # ------------------------------------------------------------------
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: its-platform/package-lock.json

      - name: Install dependencies
        working-directory: its-platform
        run: npm ci

      - name: Typecheck (tsc --noEmit)
        working-directory: its-platform
        run: npm run typecheck

      - name: Lint (eslint)
        working-directory: its-platform
        run: npm run lint

  # ------------------------------------------------------------------
  # Domain Isolation Check (ADR-014, P0.2)
  # ------------------------------------------------------------------
  domain-isolation:
    name: Domain Isolation Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: its-platform/package-lock.json

      - name: Install dependencies
        working-directory: its-platform
        run: npm ci

      - name: Run domain isolation check
        working-directory: its-platform
        run: npm run domain:check

  # ------------------------------------------------------------------
  # Content Integrity Verification
  # ------------------------------------------------------------------
  content-integrity:
    name: Content Integrity Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Run verify-integrity.py
        run: python3 verify-integrity.py

      - name: Run prd-score.py
        run: python3 prd-score.py

      # CONSTITUTION.md §6.3 release-gate report.
      #
      # `continue-on-error: true` is deliberate and is NOT the `|| true` defect. The
      # difference is what the step is asserting:
      #
      #   * the steps above — properties of the content. They can and must fail the build.
      #   * this            — a report of platform readiness. It is expected to exit 1
      #                       until the MVP lands, and failing every CI run on that fact
      #                       would train the team to ignore the job.
      #
      # The gate is blocking at `make release-check`, which is what a release is cut from.
      # This step exists so the seven gates are visible on every run and so a newly-broken
      # gate turns red here the day it happens.
      - name: Release gate report (CONSTITUTION.md §6.3)
        continue-on-error: true
        run: |
          pip install pyyaml
          python3 its-platform/scripts/verify-release-gates.py --verbose | tee release-gates.txt
          echo "---"
          echo "Summary of the seven release gates:"
          grep -E '^\[FAIL\]|^RESULT:' release-gates.txt || echo "  (no failures reported)"

  # ------------------------------------------------------------------
  # Contract Testing (OpenAPI Spec Validation)
  # ------------------------------------------------------------------
  contract-test:
    name: OpenAPI Contract Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive

      - name: Set up Node.js for spectral
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install spectral
        run: npm install -g @stoplight/spectral-cli

      - name: Validate OpenAPI spec
        working-directory: its-platform
        run: spectral lint docs/api-spec.openapi.yaml --ruleset @stoplight/spectral/rulesets/owasp-api-security.json

      - name: Validate OpenAPI spec structure
        working-directory: its-platform
        run: |
          python3 -c "
          import yaml
          with open('docs/api-spec.openapi.yaml') as f:
              spec = yaml.safe_load(f)
          assert 'openapi' in spec and spec['openapi'].startswith('3.1')
          assert 'paths' in spec and len(spec['paths']) > 0
          assert 'components' in spec and 'schemas' in spec['components']
          print(f'OpenAPI {spec[\"openapi\"]} valid: {len(spec[\"paths\"])} paths, {len(spec[\"components\"][\"schemas\"])} schemas')
          "

  # ------------------------------------------------------------------
  # Unit + domain + contract tests (jest, PGlite-free)
  # ------------------------------------------------------------------
  # `NODE_OPTIONS=--experimental-vm-modules` is required: several suites exercise
  # modules that perform dynamic ESM imports. Without the flag the run dies with
  # ERR_VM_DYNAMIC_IMPORT_CALLBACK_MISSING_FLAG instead of reporting results.
  unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: its-platform/package-lock.json

      - name: Install dependencies
        working-directory: its-platform
        run: npm ci

      - name: Run unit tests
        working-directory: its-platform
        env:
          NODE_OPTIONS: --experimental-vm-modules
        run: npx jest --ci --no-coverage --testPathIgnorePatterns /node_modules/ /tests/integration/

  # ------------------------------------------------------------------
  # Integration Tests (PGlite, in-process)
  # ------------------------------------------------------------------
  integration:
    name: Integration Tests (PGlite)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: its-platform/package-lock.json

      - name: Install dependencies
        working-directory: its-platform
        run: npm ci

      - name: Run integration tests
        working-directory: its-platform
        env:
          NODE_OPTIONS: --experimental-vm-modules
          CONTENT_REPO_PATH: ${{ github.workspace }}
        run: npx jest --ci --no-coverage --testPathPattern /tests/integration/

  # ------------------------------------------------------------------
  # Content Loader Gate (P0.5 — PGlite seed + assertions)
  # ------------------------------------------------------------------
  content-loader:
    name: Content Loader (PGlite)
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: its-platform/package-lock.json

      - name: Install dependencies
        working-directory: its-platform
        run: npm ci

      - name: Build (compiles parsers/loader to dist/)
        working-directory: its-platform
        run: npm run build

      - name: Run content-check (PGlite seed + assertions)
        working-directory: its-platform
        env:
          CONTENT_REPO_PATH: ${{ github.workspace }}
        run: node scripts/content-check.mjs

  # ------------------------------------------------------------------
  # Contract Check (OpenAPI 3.1 lint + schema smoke)
  # ------------------------------------------------------------------
  contract-check:
    name: Contract Check (OpenAPI)
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: its-platform/package-lock.json

      - name: Install dependencies
        working-directory: its-platform
        run: npm ci

      - name: Run contract-check (lint + schema validation)
        working-directory: its-platform
        run: node contract-check.mjs

  # ------------------------------------------------------------------
  # RLS + Migration Integration (PostgreSQL 16 real — ADR-014)
  # ------------------------------------------------------------------
  # P0.4 gate: the create-schema migration must replay identically on real PostgreSQL,
  # and RLS behaviour (SET LOCAL isolation, X-3 WORM grants, I-2 column grants) is only
  # provable there — PGlite cannot exercise role/GUC switching faithfully (ADR-014).
  rls-integration:
    name: RLS + Migration (PostgreSQL 16)
    runs-on: ubuntu-latest
    needs: [lint]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: its_platform_test
          POSTGRES_USER: its_platform_app_test
          POSTGRES_PASSWORD: its_platform_app_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: its-platform/package-lock.json

      - name: Install dependencies
        working-directory: its-platform
        run: npm ci

      - name: Build (compiles migration + entities to dist/)
        working-directory: its-platform
        run: npm run build

      - name: Run create-schema migration + RLS gate on PostgreSQL 16
        working-directory: its-platform
        env:
          DATABASE_URL: postgresql://its_platform_app_test:its_platform_app_test@localhost:5432/its_platform_test
        run: node scripts/migration-check.mjs

  # ------------------------------------------------------------------
  # Mutation Testing (adaptive engine)
  # ------------------------------------------------------------------
  # CONSTITUTION.md §4.8 sets a mutation-score threshold of >= 85%.
  #
  # This job was dead twice over: `if:` tested a placeholder repository name and
  # `github.event_name == 'schedule'`, with no `schedule` trigger declared, so it could
  # never run. It is NOT re-added here because no mutation runner is configured: there is
  # no stryker config and no `mutation` npm script. Re-adding the job now would mean
  # inventing a threshold that cannot report a score. The job returns when a runner
  # exists and can fail; until then §4.8 is unenforced and this comment is the record.

  # ------------------------------------------------------------------
  # Security Scan
  # ------------------------------------------------------------------
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: 'its-platform'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@1190a975f95ce23525efb6a3fc21ea29567c1b52 # v3
        with:
          sarif_file: 'trivy-results.sarif'

  # ------------------------------------------------------------------
  # Build & Push Docker Image
  # ------------------------------------------------------------------
  build-image:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs:
      - lint
      - domain-isolation
      - content-integrity
      - contract-test
      - unit
      - integration
      - content-loader
      - contract-check
      - rls-integration
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: its-platform
          push: false
          tags: its-platform:${{ github.sha }}
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ------------------------------------------------------------------
  # Deploy to Staging (ArgoCD)
  # ------------------------------------------------------------------
  # Gate CONSTITUTION.md §6.3 "Staging Deployed" (owner: Platform Lead).
  #
  # This job used to `echo "Update iac/argocd/applications/its-platform-staging.yaml"`
  # and pass. That is a gate that cannot fail, which is worse than no gate. It now
  # asserts the preconditions and fails, naming the blocker.
  #
  # Runs on `always()` so the missing-IaC fact is surfaced even when an upstream job is red.
  deploy-staging:
    name: Staging IaC Preconditions
    runs-on: ubuntu-latest
    needs: [build-image]
    if: always()
    environment: staging
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive

      - name: Assert the staging deploy path exists
        run: |
          set -euo pipefail
          missing=()
          [ -d its-platform/iac ] || missing+=("its-platform/iac/ (directory)")
          chart=$(find its-platform -name Chart.yaml -not -path '*/node_modules/*' 2>/dev/null | head -1 || true)
          [ -n "$chart" ] || missing+=("Chart.yaml (Helm chart)")
          app=$(find its-platform/iac -path '*argocd*' -name '*staging*.y*ml' 2>/dev/null | head -1 || true)
          [ -n "$app" ] || missing+=("iac/**/argocd/**/*staging*.y*ml (ArgoCD Application)")

          if [ ${#missing[@]} -ne 0 ]; then
            echo "[FAIL] gate §6.3 'Staging Deployed' cannot be satisfied:"
            for m in "${missing[@]}"; do echo "  - $m"; done
            echo
            echo "Blocker: ADR-008 (ArgoCD GitOps) is Accepted and BACKLOG.md P2.5"
            echo "('Helm chart + ArgoCD (dev/staging/prod)') is Must — neither exists."
            echo "docs/iac-spec.md describes the target; iac/ does not implement it."
            echo
            echo "Until then there is no staging environment and 'CI Green' is the only"
            echo "signal this repository emits. Do not mark this gate satisfied by hand."
            exit 1
          fi
          echo "  ok   staging IaC present: chart=$chart app=$app"

      - name: Sync ArgoCD staging application
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          # GitOps: the image tag is committed, never pushed to a cluster by hand
          # (CONSTITUTION.md §2 "GitOps", ADR-008). This step verifies the committed
          # Application points at the SHA just built and lets ArgoCD reconcile.
          sha="${GITHUB_SHA}"
          app="$(find its-platform/iac -path '*argocd*' -name '*staging*.y*ml' | head -1)"
          grep -q "$sha" "$app" || {
            echo "[FAIL] $app does not reference the built SHA $sha"
            echo "The image tag must be committed by a bump PR, not written by CI."
            exit 1
          }
          echo "  ok   $app references $sha"

  # ------------------------------------------------------------------
  # Summary
  # ------------------------------------------------------------------
  summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs:
      - lint
      - domain-isolation
      - content-integrity
      - contract-test
      - unit
      - integration
      - content-loader
      - contract-check
      - rls-integration
      - security-scan
    if: always()
    steps:
      - name: Check job statuses
        run: |
          echo "Lint: ${{ needs.lint.result }}"
          echo "Domain Isolation: ${{ needs.domain-isolation.result }}"
          echo "Content Integrity: ${{ needs.content-integrity.result }}"
          echo "Contract Test: ${{ needs.contract-test.result }}"
          echo "Unit Tests: ${{ needs.unit.result }}"
          echo "Integration Tests: ${{ needs.integration.result }}"
          echo "Content Loader: ${{ needs.content-loader.result }}"
          echo "Contract Check: ${{ needs.contract-check.result }}"
          echo "RLS + Migration: ${{ needs.rls-integration.result }}"
          echo "Security Scan: ${{ needs.security-scan.result }}"

      # Every job named in `needs` is part of the aggregate. `security-scan` was once
      # reported here but excluded from the failing set — because bandit ran with
      # `|| true` and could not fail. A gate that cannot fail must not be exempt from
      # the aggregate that claims to represent it.
      - name: Fail if any required job failed
        if: |
          needs.lint.result != 'success' ||
          needs.domain-isolation.result != 'success' ||
          needs.content-integrity.result != 'success' ||
          needs.contract-test.result != 'success' ||
          needs.unit.result != 'success' ||
          needs.integration.result != 'success' ||
          needs.content-loader.result != 'success' ||
          needs.contract-check.result != 'success' ||
          needs.rls-integration.result != 'success' ||
          needs.security-scan.result != 'success'
        run: exit 1
